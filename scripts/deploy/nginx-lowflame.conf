# ============================================================
# Low Flame Nginx 反向代理配置
# 路径：/etc/nginx/sites-available/lowflame
# 启用：ln -s /etc/nginx/sites-available/lowflame /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
# HTTPS：certbot --nginx -d lowflame.store -d www.lowflame.store
# ============================================================

server {
    listen 80;
    server_name lowflame.store www.lowflame.store;

    # 上传限制（商品图 / 语音消息，需大于应用内的 20MB 限制）
    client_max_body_size 30M;

    # 静态资源直出（减轻 Node 压力）
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / SSE 支持（商城内部聊天与实时事件依赖）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接不缓冲
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cache_bypass $http_upgrade;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
